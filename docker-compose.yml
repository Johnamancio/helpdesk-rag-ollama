services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk-rag-ollama
    depends_on:
      - ollama
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      TZ: America/Sao_Paulo
      OLLAMA_URL: http://ollama:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PREDICT: 220
      OLLAMA_TEMPERATURE: 0.2
      RAG_TOP_K: 3
    volumes:
      - ./templates.json:/app/templates.json
      - ./templates-index.json:/app/templates-index.json
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    command: ["serve"]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
